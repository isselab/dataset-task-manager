name: Bootstrap dataset repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dataset-bootstrap
  cancel-in-progress: false

env:
  TEMPLATE_REPOSITORY: isselab/agentic-dataset-template

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A failed historical run can be rerun after bootstrap has pushed a
          # newer main commit, so always operate on the current branch tip.
          ref: main

      - name: Detect bootstrap marker
        id: bootstrap
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "$TEMPLATE_REPOSITORY" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This is the template repository; bootstrap is disabled."
          elif [ -f .github/.bootstrap ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository has already been bootstrapped."
          fi

      - name: Customize generated repository
        if: steps.bootstrap.outputs.required == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/bootstrap_dataset.py

      - name: Commit generated repository
        if: steps.bootstrap.outputs.required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: bootstrap from dataset template"
          git push origin HEAD:main

      - name: Start parent registration
        if: steps.bootstrap.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-parent.yml --ref main
          echo "::notice::Parent registration was delegated to the persistent sync workflow."
